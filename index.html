body{background:#0A0C11;color:#F1F3F8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
#lock{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,#1e1b4b,#0a0f1f 70%)}

body[data-theme=light] #lock .in{background:#fff;color:#111826;border-color:#D7DDE8}
#lock input[type=password]{width:100%;box-sizing:border-box;font-size:22px;padding:12px;border-radius:12px;border:1px solid #30353F;background:#0b1226;color:#fff;text-align:center;letter-spacing:4px;margin:14px 0 10px}

#lock button{width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
#lock label{display:block;font-size:14px;opacity:.8;margin:4px 0 14px}
#lockMsg{min-height:20px;margin-top:10px;font-size:14px;font-weight:600}
.small{font-size:14px;opacity:.8}.r{color:#f43f5e}.y{color:#f59e0b}.d{opacity:.8}

.fsd, .fsd *{box-sizing:border-box}
.fsd{width:100%;min-width:0;overflow-wrap:anywhere}
.fsd button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fsd button:active,.fsd a:active{transform:scale(.98)}
@keyframes fsdPulse{0%{box-shadow:0 0 0 0 rgba(91,224,166,.65)}70%{box-shadow:0 0 0 9px rgba(91,224,166,0)}100%{box-shadow:0 0 0 0 rgba(91,224,166,0)}}
@keyframes fsdBlink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fsdFire{0%,100%{box-shadow:0 0 0 1px rgba(240,138,0,.55),0 6px 22px rgba(240,100,0,.20)}50%{box-shadow:0 0 0 2px rgba(240,138,0,.85),0 8px 30px rgba(240,100,0,.34)}}
@keyframes fsdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fsdSpin{to{transform:rotate(360deg)}}
.fsd-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5BE0A6;animation:fsdPulse 1.8s infinite;flex:0 0 auto}
.fsd-blink{animation:fsdBlink 1.2s infinite}
.fsd-fire{animation:fsdFire 2.4s ease-in-out infinite}
.fsd-in{animation:fsdIn .28s ease-out}
.fsd-spin{display:inline-block;animation:fsdSpin 1.4s linear infinite}
.fsd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.fsd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.fsd-half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fsd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.fsd-num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.fsd *{animation:none !important}}

function savedKey() { try { const k = JSON.parse(localStorage.getItem("gtb_key_v1") || "null"); return k ? { raw: b64(k.raw).buffer, salt: k.salt, iter: k.iter } : null; } catch (e) { return null; } }
function showLock(msg) { $("lock").style.display = "flex"; $("boot").style.display = "none"; $("lockMsg").innerHTML = msg || ""; setTimeout(() => $("pin").focus(), 50); }
function hideLock() { $("lock").style.display = "none"; }
function setStatus() { GTB.status.at = S.dataAt; GTB.status.src = S.src; GTB.status.err = S.dataErr || null; }
async function fetchEnv() {
  // 1) GitHub API (fresh within ~1 min). 2) raw.githubusercontent.com if the free API limit (60/hour) runs out.
  if (Date.now() > apiBlockedUntil) {
    try {
      const c = new AbortController(); const tm = setTimeout(() => c.abort(), 10000);
      const r = await fetch(SRC_API, { cache: "no-cache", headers: { Accept: "application/vnd.github.raw+json" }, signal: c.signal, referrerPolicy: "no-referrer" });
      clearTimeout(tm);
      const rem = +r.headers.get("x-ratelimit-remaining");
      if (!isNaN(rem) && r.headers.get("x-ratelimit-remaining") !== null) S.pollMs = rem > 30 ? 30000 : rem > 12 ? 60000 : 120000;
      if (r.ok) { S.src = "GitHub"; return await r.json(); }
      if (r.status === 403 || r.status === 429) { const reset = +r.headers.get("x-ratelimit-reset"); apiBlockedUntil = reset ? reset * 1000 : Date.now() + 15 * 60e3; }
    } catch (e) { }
  }
  const r = await fetch(SRC_RAW + "?t=" + Math.floor(Date.now() / 30000), { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  S.src = "GitHub (slow copy)"; S.pollMs = 60000; return await r.json();
}
async function useEnv(env) {
  if (!KEY || KEY.salt !== env.salt || KEY.iter !== env.iter) { KEY = savedKey(); if (KEY && (KEY.salt !== env.salt || KEY.iter !== env.iter)) KEY = null; }
  if (!KEY) { showLock(); return; }
  let d;
  try { d = await openEnv(env, KEY); }
  catch (e) { KEY = null; localStorage.removeItem("gtb_key_v1"); showLock("Your PIN changed. Please type it again."); return; }
  hideLock(); S.dataAt = tms(env.at || d.updatedAt); setStatus();
  if (!d.desk) { $("boot").style.display = "block"; $("boot").textContent = d.deskErr ? "Desk data has a problem right now: " + d.deskErr + ". It will retry by itself." : "Your desk is updating to the new design. Please wait a minute."; return; }
  $("boot").style.display = "none";
  window.GTB_GUARD = typeof d.watcherOk === "boolean" ? { ok: d.watcherOk, at: S.dataAt } : null;
  if (env.ct !== SHOWN) { SHOWN = env.ct; GTB.show(d.desk); }
}
async function loadData(force) {
  if (document.hidden && SHOWN && !force) return;
  try { ENV = await fetchEnv(); S.dataErr = null; await useEnv(ENV); }
  catch (e) { S.dataErr = "Can't reach GitHub right now"; setStatus(); if (!SHOWN) { $("boot").textContent = "Can't reach GitHub right now. Check your internet."; } }
}
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "lockForm") return; ev.preventDefault();
  const pin = $("pin").value; if (!pin) return;
  $("unlockBtn").disabled = true; $("lockMsg").innerHTML = '<span class="d">Checking… (takes a few seconds the first time)</span>';
  try {
    if (!ENV) ENV = await fetchEnv();
    const k = await derive(pin, ENV);
    try { await openEnv(ENV, k); } catch (e) { $("lockMsg").innerHTML = '<span class="r">❌ Wrong PIN. Please try again.</span>'; $("unlockBtn").disabled = false; $("pin").select(); return; }
    KEY = k; if ($("remember").checked) localStorage.setItem("gtb_key_v1", JSON.stringify({ raw: ub64(k.raw), salt: k.salt, iter: k.iter }));
    $("pin").value = ""; await useEnv(ENV);
  } catch (e) { $("lockMsg").innerHTML = '<span class="y">Can\'t reach GitHub right now. Check your internet and try again.</span>'; }
  $("unlockBtn").disabled = false;
});
GTB.status.onLock = () => { KEY = null; localStorage.removeItem("gtb_key_v1"); SHOWN = ""; GTB.clear(); showLock("Locked. Type your PIN to open again."); };
loadData(true);
(function poll() { setTimeout(async () => { await loadData(); poll(); }, S.pollMs || 30000); })();
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });
</script>
